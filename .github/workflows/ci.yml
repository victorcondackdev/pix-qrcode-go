name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (Go ${{ matrix.go }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go: ["1.22", "stable"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "Files not formatted with gofmt:"; echo "$unformatted"; exit 1
          fi
      - name: go vet
        run: go vet ./...
      - name: Zero dependencies
        run: |
          if grep -q '^require' go.mod; then echo "go.mod must not require modules"; exit 1; fi
      - name: go test
        run: go test -race -coverprofile=coverage.out -covermode=atomic ./...
      - name: Coverage summary
        run: go tool cover -func=coverage.out | tail -n 1
      - name: Build CLI
        run: |
          go build -trimpath -o bin/pixqr ./cmd/pixqr
          ./bin/pixqr --info '00020126330014br.gov.bcb.pix0111123456789095204000053039865406150.005802BR5912LOJA EXEMPLO6009SAO PAULO62140510PEDIDO123463047DEC'

  fuzz:
    name: fuzz smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - name: Run every fuzz target for 10s
        run: |
          for pkg in $(go list ./...); do
            dir=$(go list -f '{{.Dir}}' "$pkg")
            for target in $(grep -ho '^func Fuzz[A-Za-z0-9_]*' "$dir"/*_test.go 2>/dev/null | sed 's/^func //'); do
              echo "::group::$pkg $target"
              go test -run='^$' -fuzz="^${target}\$" -fuzztime=10s -fuzzminimizetime=1s "$pkg"
              echo "::endgroup::"
            done
          done
